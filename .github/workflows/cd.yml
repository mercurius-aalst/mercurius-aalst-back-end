---
name: Continuous Delivery

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: backend
  DOCKERFILE_PATH: Dockerfile
  CONTEXT_PATH: .

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    name: Calculate SemVersion and Create Release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: images/github-runner
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          include-component-in-tag: true

    outputs:
      VERSION: "${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}"
      RELEASE_CREATED: ${{ steps.release.outputs.release_created}}

  build-and-push-image:
    runs-on: ubuntu-24.04
    name: Build and Push Docker Image
    needs: release-please
    if: ${{ needs.release-please.outputs.RELEASE_CREATED }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT_PATH }}
          file: ${{ env.DOCKERFILE_PATH }}
          load: true
          push: false
          tags: livingwooods/mercurius-backend:${{ needs.release-please.outputs.VERSION }}

      - name: Scan release image
        id: trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: livingwooods/mercurius-backend:${{ needs.release-please.outputs.VERSION }}
          severity: "CRITICAL,HIGH"
          format: json
          output: trivy-results.json
          exit-code: "1"

      - name: Upload Trivy results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-${{ needs.release-please.outputs.VERSION }}
          path: trivy-results.json
          if-no-files-found: warn

      - name: Login to Docker Hub
        if: ${{ steps.trivy.outcome == 'success' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push release image
        if: ${{ steps.trivy.outcome == 'success' }}
        run: docker push livingwooods/mercurius-backend:${{ needs.release-please.outputs.VERSION }}
