---
name: Continuous Integration - Application

on:
  pull_request:
    branches:
      - main
      - refactor/modular-monolith
    paths:
      - src/**
      - tests/**
      - Dockerfile
      - LAN.API.sln
      - global.json
      - .editorconfig
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - NuGet.Config
      - NuGet.config
      - nuget.config
      - packages.lock.json
      - .github/workflows/ci-application.yml
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

env:
  IMAGE: backend
  DOCKERFILE_PATH: Dockerfile
  CONTEXT_PATH: .

jobs:
  build-application:
    runs-on: ubuntu-24.04
    name: "Build Application"
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.x'

    - name: Install dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build

    - name: Test
      run: dotnet test --no-build

    - name: Format
      run: dotnet format --verify-no-changes

  build-image:
    runs-on: ubuntu-24.04
    name: "Build Docker Image"
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Create image
      run: |
          docker build \
            --tag ${{ env.IMAGE }} \
            --file ${{ env.DOCKERFILE_PATH }} \
            ${{ env.CONTEXT_PATH }}

          docker image save \
            ${{ env.IMAGE }} \
            --output ${{ env.IMAGE }}.tar

    - name: Vulnerability Scan
      id: trivy
      continue-on-error: true
      uses: aquasecurity/trivy-action@0.35.0
      with:
        input: ${{ env.IMAGE }}.tar
        severity: 'CRITICAL,HIGH'
        format: json
        output: trivy-results.json
        exit-code: '1'

    - name: Comment Trivy results on PR
      if: ${{ always() }}
      continue-on-error: true
      uses: actions/github-script@v7.0.1
      env:
        TRIVY_RESULTS_PATH: trivy-results.json
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const path = process.env.TRIVY_RESULTS_PATH;
          let markdown = '';

          if (fs.existsSync(path)) {
            const trivyResults = JSON.parse(fs.readFileSync(path, 'utf8'));

            if (trivyResults.Results?.length > 0) {
              trivyResults.Results.forEach(result => {
                markdown += `## ${result.Target}\n\n`;

                if (result.Vulnerabilities && result.Vulnerabilities.length > 0) {
                  markdown += '| Vulnerability ID | Package | Severity | Description |\n';
                  markdown += '|------------------|---------|----------|-------------|\n';

                  result.Vulnerabilities.forEach(vulnerability => {
                    markdown += `| ${vulnerability.VulnerabilityID} | ${vulnerability.PkgName} | ${vulnerability.Severity} | ${vulnerability.Description} |\n`;
                  });
                } else {
                  markdown += 'No vulnerabilities found by Trivy.\n\n';
                }

                markdown += '\n\n';
              });
            } else {
              markdown = 'No vulnerabilities found by Trivy.\n\n';
            }
          } else {
            markdown = 'Trivy results file not found.\n\n';
          }

          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: markdown.substring(0, 65000)
          });

    - name: Fail on HIGH or CRITICAL vulnerabilities
      if: ${{ always() && steps.trivy.outcome == 'failure' }}
      run: exit 1
